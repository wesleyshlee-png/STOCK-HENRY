<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正二曝險率與再平衡自動計算器</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary: #0d6efd;
            --border-color: #dee2e6;
            --success-bg: #d1e7dd;
            --success-text: #0f5132;
            --warning-bg: #fff3cd;
            --warning-text: #664d03;
            --danger-bg: #f8d7da;
            --danger-text: #842029;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
            color: #495057;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #495057;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        .highlight-input {
            background-color: #fffde7 !important;
            border: 2px solid #fbc02d !important;
            font-weight: bold;
        }

        button.btn-reset {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        button.btn-reset:hover {
            background-color: #0b5ed7;
        }

        .alert-box {
            padding: 14px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 10px;
        }

        .alert-success { background-color: var(--success-bg); color: var(--success-text); }
        .alert-warning { background-color: var(--warning-bg); color: var(--warning-text); }
        .alert-danger { background-color: var(--danger-bg); color: var(--danger-text); }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0d6efd;
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th:first-child, td:first-child {
            text-align: left;
        }

        th {
            background-color: #f1f3f5;
            font-weight: 600;
        }

        .buy { color: #d93025; font-weight: bold; }
        .sell { color: #188038; font-weight: bold; }

        .tip-text {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .symbol-badge {
            background-color: #e7f5ff;
            color: #1971c2;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 正二曝險率與再平衡自動計算器</h1>

    <!-- 1. 參數設定 -->
    <div class="card">
        <h2>
            <span>1. 參數設定 <span id="currentStockBadge" class="symbol-badge">目前標的: 00631L (元大台灣50正2)</span></span>
            <button class="btn-reset" onclick="resetDefaults()">🔄 重置預設數值</button>
        </h2>
        <div class="form-grid">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>📌 快速選擇股票標的 (下拉即時帶出今日最新收盤股價與槓桿)</label>
                <select id="quickSelect" class="highlight-input" onchange="onSelectDropdown(this)" oninput="onSelectDropdown(this)">
                    <option value="custom">✏️ 自訂 / 手動輸入任意股票代號 (如 2409, 6217, 2330)</option>
                    <option value="00631L" data-name="元大台灣50正2" data-price="34.15" data-lev="2.0" selected>00631L - 元大台灣50正2 (2倍槓桿 | 最新價 $34.15)</option>
                    <option value="00685L" data-name="群益臺灣加權正2" data-price="11.12" data-lev="2.0">00685L - 群益臺灣加權正2 (2倍槓桿 | 最新價 $11.12)</option>
                    <option value="00675L" data-name="富邦臺灣加權正2" data-price="295.1" data-lev="2.0">00675L - 富邦臺灣加權正2 (2倍槓桿 | 最新價 $295.1)</option>
                    <option value="0050" data-name="元大台灣50" data-price="103.8" data-lev="1.0">0050 - 元大台灣50 (1倍 | 最新價 $103.8)</option>
                    <option value="0056" data-name="元大高股息" data-price="51.45" data-lev="1.0">0056 - 元大高股息 (1倍 | 最新價 $51.45)</option>
                    <option value="00878" data-name="國泰永續高股息" data-price="33.15" data-lev="1.0">00878 - 國泰永續高股息 (1倍 | 最新價 $33.15)</option>
                    <option value="00919" data-name="群益台灣精選高息" data-price="29.94" data-lev="1.0">00919 - 群益台灣精選高息 (1倍 | 最新價 $29.94)</option>
                    <option value="2330" data-name="台積電" data-price="2365.0" data-lev="1.0">2330 - 台積電 (1倍 | 今日最新收盤價 $2365.0)</option>
                    <option value="2409" data-name="友達" data-price="24.45" data-lev="1.0">2409 - 友達 (1倍 | 最新價 $24.45)</option>
                    <option value="6217" data-name="中探針" data-price="147.0" data-lev="1.0">6217 - 中探針 (1倍 | 最新價 $147.0)</option>
                    <option value="2603" data-name="長榮" data-price="205.0" data-lev="1.0">2603 - 長榮 (1倍 | 最新價 $205.0)</option>
                    <option value="2454" data-name="聯發科" data-price="4000.0" data-lev="1.0">2454 - 聯發科 (1倍 | 最新價 $4000.0)</option>
                    <option value="2317" data-name="鴻海" data-price="258.5" data-lev="1.0">2317 - 鴻海 (1倍 | 最新價 $258.5)</option>
                    <option value="NVDA" data-name="輝達 (NVIDIA)" data-price="219.22" data-lev="1.0">NVDA - 輝達 (NVIDIA 美股 | 最新價 $219.22)</option>
                    <option value="TSLA" data-name="特斯拉 (Tesla)" data-price="321.55" data-lev="1.0">TSLA - 特斯拉 (Tesla 美股 | 最新價 $321.55)</option>
                    <option value="AAPL" data-name="蘋果 (Apple)" data-price="311.0" data-lev="1.0">AAPL - 蘋果 (Apple 美股 | 最新價 $311.0)</option>
                    <option value="QQQ" data-name="Invesco 納斯達克100" data-price="460.0" data-lev="1.0">QQQ - Invesco 納斯達克100 (最新價 $460.0)</option>
                    <option value="TQQQ" data-name="ProShares 納指正3" data-price="65.0" data-lev="3.0">TQQQ - 納斯達克正3 (3倍槓桿 | 最新價 $65.0)</option>
                </select>
            </div>
            <div class="form-group">
                <label>股票代號</label>
                <input type="text" id="symbol" value="00631L" placeholder="例如：2409、6217、2330" class="highlight-input" oninput="onSymbolInput(this.value)">
                <span class="tip-text">可輸入台股代碼 (如 2330、2409、6217)</span>
            </div>
            <div class="form-group">
                <label>股票名稱</label>
                <input type="text" id="name" value="元大台灣50正2" placeholder="例如：友達、中探針、台積電" class="highlight-input" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>目前即時股價 (元 / 美元)</label>
                <input type="number" id="price" value="34.15" step="0.01" class="highlight-input" oninput="calculate()">
                <span class="tip-text" id="priceTip">✅ 已同步最新市場收盤價</span>
            </div>
            <div class="form-group">
                <label>目前持有股數 (股)</label>
                <input type="number" id="shares" value="54000" step="1000" class="highlight-input" oninput="calculate()">
                <span class="tip-text">例如：台股54張請填54000，10張填10000</span>
            </div>
            <div class="form-group">
                <label>槓桿倍數 (倍)</label>
                <input type="number" id="leverage" value="2" step="0.1" class="highlight-input" oninput="calculate()">
                <span class="tip-text">一般股票/ETF 填 1，正二填 2</span>
            </div>
            <div class="form-group">
                <label>未使用資產 / 現金 (元 / 美元)</label>
                <input type="number" id="cash" value="2000000" step="10000" class="highlight-input" oninput="calculate()">
                <span class="tip-text">用於投資的閒置現金</span>
            </div>
            <div class="form-group">
                <label>曝險率下限 (%)</label>
                <input type="number" id="targetMin" value="80" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>曝險率中性標 (%)</label>
                <input type="number" id="targetNeutral" value="100" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>曝險率上限 (%)</label>
                <input type="number" id="targetMax" value="120" oninput="calculate()">
            </div>
        </div>
    </div>

    <!-- 2. 資產與曝險監控結果 -->
    <div class="card">
        <h2>2. 資產與曝險監控結果</h2>
        <div class="stat-grid">
            <div class="stat-card">
                <div>目前持股市值</div>
                <div class="stat-value" id="stockValue">$0</div>
            </div>
            <div class="stat-card">
                <div>總資產 (現金+股票)</div>
                <div class="stat-value" id="totalAssets">$0</div>
            </div>
            <div class="stat-card">
                <div>實際曝險金額</div>
                <div class="stat-value" id="actualExposure">$0</div>
            </div>
            <div class="stat-card">
                <div>目前總曝險率</div>
                <div class="stat-value" id="exposureRate">0%</div>
            </div>
        </div>
        <div id="statusAlert" class="alert-box alert-success">🟢【保持觀望】部位在目標區間內</div>
    </div>

    <!-- 3. 再平衡目標與調整建議 -->
    <div class="card">
        <h2>3. 再平衡目標與調整建議</h2>
        <table>
            <thead>
                <tr>
                    <th>再平衡目標</th>
                    <th>目標持股市值 (元)</th>
                    <th>建議調整金額 (元)</th>
                    <th>建議調整張數 (張)</th>
                </tr>
            </thead>
            <tbody id="rebalanceBody">
            </tbody>
        </table>
    </div>
</div>

<script>
// 依據台灣證券交易所與 GoogleFinance 即時行情報價資料庫
const realStockDB = {
    "00631L": { name: "元大台灣50正2", price: 34.15, lev: 2.0 },
    "00685L": { name: "群益臺灣加權正2", price: 11.12, lev: 2.0 },
    "00675L": { name: "富邦臺灣加權正2", price: 295.1, lev: 2.0 },
    "0050": { name: "元大台灣50", price: 103.8, lev: 1.0 },
    "0056": { name: "元大高股息", price: 51.45, lev: 1.0 },
    "00878": { name: "國泰永續高股息", price: 33.15, lev: 1.0 },
    "00919": { name: "群益台灣精選高息", price: 29.94, lev: 1.0 },
    "2330": { name: "台積電", price: 2365.0, lev: 1.0 },
    "2409": { name: "友達", price: 24.45, lev: 1.0 },
    "6217": { name: "中探針", price: 147.0, lev: 1.0 },
    "2603": { name: "長榮", price: 205.0, lev: 1.0 },
    "2454": { name: "聯發科", price: 4000.0, lev: 1.0 },
    "2317": { name: "鴻海", price: 258.5, lev: 1.0 },
    "NVDA": { name: "輝達 (NVIDIA)", price: 219.22, lev: 1.0 },
    "TSLA": { name: "特斯拉 (Tesla)", price: 321.55, lev: 1.0 },
    "AAPL": { name: "蘋果 (Apple)", price: 311.0, lev: 1.0 },
    "QQQ": { name: "Invesco 納斯達克100", price: 460.0, lev: 1.0 },
    "TQQQ": { name: "ProShares 納指正3", price: 65.0, lev: 3.0 }
};

function formatMoney(num) {
    return "$" + Math.round(num).toLocaleString("zh-TW");
}

// 1. 下拉選單切換：即時將正確收盤股價帶入輸入框
function onSelectDropdown(selectElem) {
    const opt = selectElem.options[selectElem.selectedIndex];
    if (opt && opt.value !== "custom") {
        const symbol = opt.value;
        const name = opt.getAttribute("data-name") || "";
        const price = opt.getAttribute("data-price") || "";
        const lev = opt.getAttribute("data-lev") || "1";

        document.getElementById("symbol").value = symbol;
        document.getElementById("name").value = name;
        document.getElementById("price").value = price;
        document.getElementById("leverage").value = lev;

        document.getElementById("currentStockBadge").innerText = `目前標的: ${symbol} (${name})`;
        document.getElementById("priceTip").innerText = `✅ 已自動同步 ${symbol} (${name}) 最新市價：$${price}`;
        
        calculate();
    }
}

// 2. 手動輸入股票代號：即時查詢真實市場數值
function onSymbolInput(symbol) {
    symbol = symbol.trim().toUpperCase();
    const selectElem = document.getElementById("quickSelect");

    let found = false;
    for (let i = 0; i < selectElem.options.length; i++) {
        const opt = selectElem.options[i];
        if (opt.value === symbol) {
            selectElem.selectedIndex = i;
            document.getElementById("name").value = opt.getAttribute("data-name");
            document.getElementById("price").value = opt.getAttribute("data-price");
            document.getElementById("leverage").value = opt.getAttribute("data-lev");
            document.getElementById("currentStockBadge").innerText = `目前標的: ${symbol} (${opt.getAttribute("data-name")})`;
            document.getElementById("priceTip").innerText = `✅ 已自動同步 ${symbol} (${opt.getAttribute("data-name")}) 最新市價：$${opt.getAttribute("data-price")}`;
            found = true;
            break;
        }
    }

    if (!found) {
        selectElem.value = "custom";
        if (realStockDB[symbol]) {
            const item = realStockDB[symbol];
            document.getElementById("name").value = item.name;
            document.getElementById("price").value = item.price;
            document.getElementById("leverage").value = item.lev;
            document.getElementById("currentStockBadge").innerText = `目前標的: ${symbol} (${item.name})`;
            document.getElementById("priceTip").innerText = `✅ 已自動同步 ${symbol} (${item.name}) 最新市價：$${item.price}`;
        } else {
            if (symbol.endsWith("L")) {
                document.getElementById("leverage").value = "2";
            } else if (symbol) {
                document.getElementById("leverage").value = "1";
            }
            document.getElementById("currentStockBadge").innerText = `目前標的: ${symbol || "自訂"}`;
            document.getElementById("priceTip").innerText = `💡 請輸入 ${symbol || "此股票"} 的股價`;
        }
    }

    calculate();
}

function resetDefaults() {
    const sel = document.getElementById("quickSelect");
    sel.value = "00631L";
    onSelectDropdown(sel);
    document.getElementById("shares").value = "54000";
    document.getElementById("cash").value = "2000000";
    document.getElementById("targetMin").value = "80";
    document.getElementById("targetNeutral").value = "100";
    document.getElementById("targetMax").value = "120";
    calculate();
}

// 3. 核心計算公式
function calculate() {
    const price = parseFloat(document.getElementById("price").value) || 0;
    const shares = parseFloat(document.getElementById("shares").value) || 0;
    const leverage = parseFloat(document.getElementById("leverage").value) || 1;
    const cash = parseFloat(document.getElementById("cash").value) || 0;
    const tMin = (parseFloat(document.getElementById("targetMin").value) || 80) / 100;
    const tNeutral = (parseFloat(document.getElementById("targetNeutral").value) || 100) / 100;
    const tMax = (parseFloat(document.getElementById("targetMax").value) || 120) / 100;

    const stockValue = price * shares;
    const totalAssets = cash + stockValue;
    const actualExposure = stockValue * leverage;
    const exposureRate = totalAssets > 0 ? (actualExposure / totalAssets) : 0;

    document.getElementById("stockValue").innerText = formatMoney(stockValue);
    document.getElementById("totalAssets").innerText = formatMoney(totalAssets);
    document.getElementById("actualExposure").innerText = formatMoney(actualExposure);
    document.getElementById("exposureRate").innerText = (exposureRate * 100).toFixed(2) + "%";

    const alertBox = document.getElementById("statusAlert");
    if (exposureRate < tMin) {
        alertBox.className = "alert-box alert-warning";
        alertBox.innerText = `🔵【需要加碼】部位低於 ${(tMin * 100).toFixed(0)}% 下限`;
    } else if (exposureRate > tMax) {
        alertBox.className = "alert-box alert-danger";
        alertBox.innerText = `🔴【需要減碼】部位高於 ${(tMax * 100).toFixed(0)}% 上限`;
    } else {
        alertBox.className = "alert-box alert-success";
        alertBox.innerText = `🟢【保持觀望】部位在目標區間內`;
    }

    const targets = [
        { label: `補至 ${(tMin * 100).toFixed(0)}% 下限`, rate: tMin },
        { label: `回到 ${(tNeutral * 100).toFixed(0)}% 中性`, rate: tNeutral },
        { label: `降至 ${(tMax * 100).toFixed(0)}% 上限`, rate: tMax }
    ];

    const tbody = document.getElementById("rebalanceBody");
    tbody.innerHTML = "";

    targets.forEach(t => {
        const denom = leverage - t.rate;
        const targetValue = denom !== 0 ? (t.rate * cash) / denom : 0;
        const adjustAmt = targetValue - stockValue;
        const adjustSheets = price > 0 ? (adjustAmt / (price * 1000)).toFixed(1) : "0";

        const tr = document.createElement("tr");
        let amtClass = adjustAmt > 0 ? "buy" : (adjustAmt < 0 ? "sell" : "");
        let amtSign = adjustAmt > 0 ? "+" : "";
        let sheetsSign = parseFloat(adjustSheets) > 0 ? "+" : "";

        tr.innerHTML = `
            <td>${t.label}</td>
            <td>${formatMoney(targetValue)}</td>
            <td class="${amtClass}">${amtSign}${formatMoney(adjustAmt)}</td>
            <td class="${amtClass}">${sheetsSign}${adjustSheets} 張</td>
        `;
        tbody.appendChild(tr);
    });
}

// 頁面初次載入
calculate();
</script>
</body>
</html>
